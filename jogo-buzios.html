<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Búzios — Terreiro Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg: #F6F2E9;
  --ink: #1E2A20;
  --ink-soft: #4B5A4E;
  --green: #2F4A34;
  --green-dark: #1B2E20;
  --gold: #B98A2C;
  --gold-soft: #E9DCB9;
  --line: rgba(30,42,32,0.14);
  --card: #FFFFFF;
  --radius: 18px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background: var(--bg);
  font-family:'Inter', sans-serif;
  color: var(--ink);
  display:flex;
  justify-content:center;
  padding:32px 16px;
}
.device{
  width:380px;
  background: var(--green-dark);
  border-radius:36px;
  padding:14px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.25);
}
.screen{
  background: var(--bg);
  border-radius:24px;
  min-height:720px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.status-dot{
  width:36px; height:4px; background:var(--ink); opacity:0.15;
  border-radius:2px; margin:10px auto 0;
}
.view{ display:none; flex:1; flex-direction:column; padding:20px 20px 0; }
.view.active{ display:flex; }
h1,h2,h3{ font-family:'Fraunces', serif; font-weight:500; margin:0; color:var(--ink); }
p{ margin:0; }
.eyebrow{
  font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
  color: var(--ink-soft); font-weight:500;
}
.top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.greeting{ font-size:15px; font-family:'Fraunces', serif; }
.icon-btn{
  width:34px; height:34px; border-radius:50%; background:var(--card);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); font-size:15px; cursor:pointer;
}
.guia-card{
  background: var(--green); color:#fff; border-radius: var(--radius);
  padding:22px 20px; margin-bottom:16px; position:relative; overflow:hidden;
  text-align:center;
}
.guia-card .eyebrow{ color: var(--gold-soft); }
.guia-card h2{ color:#fff; font-size:24px; margin-top:6px; }
.guia-card .sub{ font-size:12px; color:#D9E2DA; margin-top:4px; }
.ring{
  position:absolute; right:-30px; top:-30px; width:120px; height:120px;
  border-radius:50%; border:1px solid rgba(255,255,255,0.18);
}
.ring.small{ right:-10px; top:-10px; width:70px; height:70px; }
.ring.left{ left:-30px; bottom:-40px; right:auto; top:auto; }

.filters{ display:flex; gap:8px; margin-bottom:16px; }
.filter{
  font-size:11.5px; padding:6px 12px; border-radius:20px; white-space:nowrap;
  border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; background:var(--card);
}
.filter.active{ background:var(--green); border-color:var(--green); color:#fff; }

.throw-btn{
  width:100%; border:none; background:var(--gold); color:#fff;
  font-family:'Fraunces', serif; font-size:16px; font-weight:500;
  padding:16px; border-radius:14px; cursor:pointer; margin-bottom:18px;
  letter-spacing:0.01em;
}
.throw-btn:disabled{ opacity:0.55; cursor:default; }

.buzios-circle{
  position:relative;
  width:100%;
  max-width:300px;
  aspect-ratio: 1 / 1;
  margin:0 auto 18px;
  border-radius:50%;
  background: var(--gold-soft);
  /* Placeholder do tapete/base — troque por uma imagem real depois:
     background-image: url('assets/base-buzios.png');
     background-size: cover; background-position: center; */
  box-shadow: inset 0 0 0 2px rgba(30,42,32,0.10), 0 6px 16px rgba(30,42,32,0.12);
}
.buzio{
  position:absolute;
  width:34px; height:38px;
  border-radius: 40% 40% 45% 45% / 55% 55% 45% 45%;
  display:flex; align-items:center; justify-content:center;
  transition: transform 0.5s cubic-bezier(.2,.9,.3,1.2), opacity 0.3s ease;
  transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
  opacity:0;
  /* Placeholder — trocar por imagens realistas depois, ex:
     .buzio.aberto{ background-image:url('assets/buzio-aberto.png'); }
     .buzio.fechado{ background-image:url('assets/buzio-fechado.png'); }
     background-size:cover; background-repeat:no-repeat; */
}
.buzio.tossed{ opacity:1; }
.buzio.aberto{ background: var(--green); box-shadow: inset 0 0 0 2px var(--gold-soft); }
.buzio.aberto::after{ content:""; width:55%; height:14%; background:var(--gold-soft); border-radius:6px; }
.buzio.fechado{ background: #EDE6D3; box-shadow: inset 0 0 0 2px var(--line); }

.stat-row{ display:flex; gap:10px; margin-bottom:16px; }
.stat{
  flex:1; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:12px; text-align:center;
}
.stat .num{ font-family:'Fraunces', serif; font-size:22px; }
.stat .label{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

.oracle-card{
  background:var(--card); border:1px solid var(--line); border-radius: var(--radius);
  padding:18px; margin-bottom:16px;
}
.oracle-card .eyebrow{ margin-bottom:6px; }
.oracle-card h3{ font-size:18px; margin-bottom:8px; }
.oracle-card p.texto{ font-size:13px; line-height:1.55; color:var(--ink-soft); }
.oracle-card .edit-note{
  margin-top:10px; font-size:10.5px; color:var(--gold); border-top:1px dashed var(--line);
  padding-top:8px; line-height:1.4;
}

.section-label{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
.list-item{
  display:flex; align-items:center; gap:12px; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px;
  cursor:pointer;
}
.list-item .dot{
  width:36px; height:36px; border-radius:50%; background: var(--gold-soft);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  color: var(--gold); font-size:13px; font-family:'Fraunces', serif; font-weight:600;
}
.list-item .meta{ flex:1; }
.list-item .title{ font-size:13.5px; font-weight:500; }
.list-item .sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
.list-item .chev{ color:var(--ink-soft); font-size:13px; }

.empty-state{
  text-align:center; color:var(--ink-soft); font-size:12.5px; padding:40px 10px;
}

.clear-btn{
  background:none; border:1px solid var(--line); color:var(--ink-soft);
  font-size:12px; padding:10px; border-radius:12px; cursor:pointer; margin-top:6px;
}

.tabbar{
  display:flex; justify-content:space-around; align-items:center;
  padding:14px 10px; border-top:1px solid var(--line); margin-top:auto; background:var(--bg);
}
.tab{
  background:none; border:none; color:var(--ink-soft); font-size:11px;
  display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  font-family:'Inter', sans-serif;
}
.tab .glyph{ width:20px; height:20px; border-radius:6px; border:1.5px solid currentColor; }
.tab.active{ color:var(--green); font-weight:600; }

.scroll{ overflow-y:auto; padding-bottom:10px; }
</style>
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="status-dot"></div>

    <!-- ================= LANÇAR ================= -->
    <section id="view-lancar" class="view active">
      <div class="top-row">
        <span class="greeting">Jogo de Búzios</span>
        <div class="icon-btn" onclick="showView('historico')">≡</div>
      </div>

      <div class="filters" id="sistema-filters">
        <div class="filter active" data-sistema="16" onclick="setSistema(this, 16)">16 búzios</div>
        <div class="filter" data-sistema="18" onclick="setSistema(this, 18)">18 búzios</div>
      </div>

      <div class="guia-card">
        <div class="ring"></div>
        <div class="ring small"></div>
        <p class="eyebrow" id="throw-eyebrow">Pronto para consultar</p>
        <h2 id="throw-title">Toque para lançar</h2>
        <p class="sub" id="throw-sub">Sistema de 16 búzios</p>
      </div>

      <button class="throw-btn" id="btn-lancar" onclick="lancarBuzios()">Lançar búzios</button>

      <div class="buzios-circle" id="buzios-circle"></div>

      <div id="resultado-area"></div>
    </section>

    <!-- ================= HISTÓRICO ================= -->
    <section id="view-historico" class="view">
      <div class="top-row">
        <h3>Histórico</h3>
        <div class="icon-btn" onclick="showView('lancar')">‹</div>
      </div>
      <p class="section-label">Consultas salvas neste navegador</p>
      <div class="scroll" id="historico-list"></div>
      <button class="clear-btn" onclick="limparHistorico()">Limpar histórico</button>

      <div class="tabbar">
        <button class="tab" onclick="showView('lancar')"><span class="glyph"></span>Lançar</button>
        <button class="tab active" onclick="showView('historico')"><span class="glyph"></span>Histórico</button>
      </div>
    </section>

  </div>
</div>

<script>
/* ==========================================================
   CONFIGURAÇÃO SUPABASE — preencha com os dados do seu projeto
   (Project Settings > API no painel do Supabase)
   ========================================================== */
const SUPABASE_URL = "https://aewcxqzpbipwcdpsjfht.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mINpOQLVbi0pilHc9bEtBA_l1a0o6c6";

const supabaseClient = (SUPABASE_URL.startsWith("http"))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ==========================================================
   ESTADO
   ========================================================== */
const STORAGE_KEY = "buzios_historico_v1";

const appState = {
  sistema: 16,
  historico: [],
  overrides: { 16: {}, 18: {} }, // preenchido a partir do Supabase
};

/* ==========================================================
   INTERPRETAÇÃO DOS RESULTADOS
   --------------------------------------------------------
   As leituras "oficiais" (nomes/significados que você usa no
   terreiro) ficam salvas na tabela buzios_leituras do Supabase e
   são editadas pelo admin em admin-buzios.html. Se não houver
   override cadastrado pra um resultado, cai numa leitura genérica
   estrutural (baseada só na proporção aberto/fechado).
   ========================================================== */
async function carregarOverrides() {
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from("buzios_leituras")
      .select("sistema, abertos, titulo, texto");
    if (error) throw error;
    const overrides = { 16: {}, 18: {} };
    (data || []).forEach(row => {
      if (row.titulo || row.texto) {
        overrides[row.sistema] = overrides[row.sistema] || {};
        overrides[row.sistema][row.abertos] = { titulo: row.titulo, texto: row.texto };
      }
    });
    appState.overrides = overrides;
  } catch (e) {
    console.warn("Não foi possível carregar leituras do Supabase:", e);
  }
}

function leituraGenerica(abertos, total) {
  const razao = abertos / total;
  let tom, texto;
  if (abertos === total) {
    tom = "Abertura total";
    texto = "Todos os búzios caíram com a boca virada para cima. É um resultado extremo, de forte concentração de força — merece ser lido com calma e, se possível, confirmado por quem tem a formação para interpretar esse tipo de jogo.";
  } else if (abertos === 0) {
    tom = "Fechamento total";
    texto = "Nenhum búzio abriu. Também é um resultado extremo, associado a recolhimento e cautela — vale revisitar a pergunta feita antes do lançamento.";
  } else if (razao > 0.6) {
    tom = "Maioria aberta";
    texto = "A maior parte dos búzios abriu, indicando um momento de movimento e resposta mais direta às questões trazidas.";
  } else if (razao < 0.4) {
    tom = "Maioria fechada";
    texto = "A maior parte dos búzios fechou, sugerindo um momento de espera, escuta interna ou algo ainda não pronto para se revelar.";
  } else {
    tom = "Equilíbrio";
    texto = "O resultado ficou equilibrado entre abertos e fechados — sinal de que forças distintas estão em jogo ao mesmo tempo.";
  }
  return {
    titulo: `${abertos} de ${total} abertos — ${tom}`,
    texto,
    generico: true,
  };
}

function getLeitura(sistema, abertos) {
  const override = appState.overrides[sistema] && appState.overrides[sistema][abertos];
  if (override && (override.titulo || override.texto)) return { ...override, generico: false };
  return leituraGenerica(abertos, sistema);
}

/* ==========================================================
   PERSISTÊNCIA (localStorage)
   ========================================================== */
function carregarHistorico() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    appState.historico = raw ? JSON.parse(raw) : [];
  } catch (e) {
    appState.historico = [];
  }
}

function salvarHistorico() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.historico));
  } catch (e) {
    console.warn("Não foi possível salvar o histórico:", e);
  }
}

function limparHistorico() {
  if (!confirm("Apagar todo o histórico salvo neste navegador?")) return;
  appState.historico = [];
  salvarHistorico();
  renderHistorico();
}

/* ==========================================================
   NAVEGAÇÃO
   ========================================================== */
function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  if (name === "historico") renderHistorico();
}

function setSistema(el, valor) {
  document.querySelectorAll("#sistema-filters .filter").forEach(f => f.classList.remove("active"));
  el.classList.add("active");
  appState.sistema = valor;
  document.getElementById("throw-sub").textContent = `Sistema de ${valor} búzios`;
  document.getElementById("resultado-area").innerHTML = "";
  document.getElementById("buzios-circle").innerHTML = "";
}

/* ==========================================================
   ESPALHAMENTO DENTRO DO CÍRCULO
   --------------------------------------------------------
   Distribuição uniforme por área (raio = R * sqrt(random)),
   com tentativas de evitar sobreposição forte entre búzios,
   e rotação aleatória pra parecer "jogado", não alinhado.
   ========================================================== */
function gerarPosicoes(qtd, containerPx, shellPx) {
  const R = containerPx / 2;
  const shellR = shellPx / 2;
  const posicoes = [];

  for (let i = 0; i < qtd; i++) {
    let melhor = null;
    for (let tentativa = 0; tentativa < 40; tentativa++) {
      const raio = (R - shellR * 0.9) * Math.sqrt(Math.random());
      const angulo = Math.random() * Math.PI * 2;
      const x = R + raio * Math.cos(angulo);
      const y = R + raio * Math.sin(angulo);

      const distMin = Math.min(
        ...posicoes.map(p => Math.hypot(p.x - x, p.y - y)),
        Infinity
      );

      if (distMin >= shellPx * 0.72) {
        melhor = { x, y };
        break;
      }
      // guarda a melhor tentativa mesmo com sobreposição leve,
      // caso não consiga um espaço totalmente livre
      if (!melhor || distMin > melhor.dist) melhor = { x, y, dist: distMin };
    }
    posicoes.push({
      x: melhor.x,
      y: melhor.y,
      rot: Math.round(Math.random() * 360),
    });
  }
  return posicoes;
}

/* ==========================================================
   LANÇAMENTO
   ========================================================== */
function lancarBuzios() {
  const btn = document.getElementById("btn-lancar");
  const circle = document.getElementById("buzios-circle");
  const total = appState.sistema;

  btn.disabled = true;
  document.getElementById("throw-eyebrow").textContent = "Lançando…";
  document.getElementById("throw-title").textContent = "Consultando";
  document.getElementById("resultado-area").innerHTML = "";

  // gera resultado: cada búzio tem ~45% de chance de abrir
  // (leve viés para "fechado", como no jogo físico com búzios limados)
  const resultados = Array.from({ length: total }, () => Math.random() < 0.45);
  const abertos = resultados.filter(Boolean).length;

  circle.innerHTML = "";
  const containerPx = circle.clientWidth;
  const shellPx = total > 16 ? 30 : 34;
  const posicoes = gerarPosicoes(total, containerPx, shellPx);

  resultados.forEach((aberto, i) => {
    const div = document.createElement("div");
    div.className = "buzio " + (aberto ? "aberto" : "fechado");
    const p = posicoes[i];
    div.style.width = shellPx + "px";
    div.style.height = Math.round(shellPx * 1.12) + "px";
    div.style.left = p.x + "px";
    div.style.top = p.y + "px";
    circle.appendChild(div);
    setTimeout(() => {
      div.style.transform = `translate(-50%, -50%) scale(1) rotate(${p.rot}deg)`;
      div.classList.add("tossed");
    }, 25 * i);
  });

  setTimeout(() => {
    document.getElementById("throw-eyebrow").textContent = "Resultado";
    document.getElementById("throw-title").textContent = `${abertos} abertos, ${total - abertos} fechados`;

    const leitura = getLeitura(total, abertos);
    mostrarResultado(leitura, total, abertos);

    appState.historico.unshift({
      data: new Date().toISOString(),
      sistema: total,
      abertos,
      titulo: leitura.titulo,
    });
    salvarHistorico();

    btn.disabled = false;
  }, 25 * total + 500);
}

function mostrarResultado(leitura, total, abertos) {
  const area = document.getElementById("resultado-area");
  area.innerHTML = `
    <div class="stat-row">
      <div class="stat"><p class="num">${abertos}</p><p class="label">abertos</p></div>
      <div class="stat"><p class="num">${total - abertos}</p><p class="label">fechados</p></div>
    </div>
    <div class="oracle-card">
      <p class="eyebrow">Leitura</p>
      <h3>${leitura.titulo}</h3>
      <p class="texto">${leitura.texto}</p>
      ${leitura.generico ? '<p class="edit-note">Leitura estrutural genérica — cadastre o texto oficial pra este resultado no painel admin.</p>' : ''}
    </div>
  `;
}

/* ==========================================================
   HISTÓRICO
   ========================================================== */
function renderHistorico() {
  const list = document.getElementById("historico-list");
  if (!appState.historico.length) {
    list.innerHTML = '<div class="empty-state">Nenhuma consulta salva ainda.<br>Faça um lançamento na aba "Lançar".</div>';
    return;
  }
  list.innerHTML = appState.historico.map(item => {
    const data = new Date(item.data);
    const dataFmt = data.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" });
    const horaFmt = data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    return `
      <div class="list-item">
        <div class="dot">${item.abertos}</div>
        <div class="meta">
          <p class="title">${item.titulo}</p>
          <p class="sub">${item.sistema} búzios · ${dataFmt} às ${horaFmt}</p>
        </div>
      </div>
    `;
  }).join("");
}

/* ==========================================================
   INICIALIZAÇÃO
   ========================================================== */
document.addEventListener("DOMContentLoaded", async () => {
  carregarHistorico();
  const btn = document.getElementById("btn-lancar");
  btn.disabled = true;
  await carregarOverrides();
  btn.disabled = false;
});
</script>
</body>
</html>
